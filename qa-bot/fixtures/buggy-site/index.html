<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Widgets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">Acme</a>
    <nav>
      <a href="/about.html">About</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/contact.html">Contact</a>
      <a href="#features">Features</a>
    </nav>
  </header>
  <main>
    <h1>Widgets for everyone</h1>
    <p class="faint">The best widgets money can buy. Trusted by teams everywhere.</p>
    <img src="/img/hero-missing.png">
    <div class="price-row">Starting at <span id="price"></span> per month</div>
    <div class="wide-banner">Limited offer: this banner is exactly one thousand pixels wide and breaks small screens</div>
    <button id="buy" class="btn">Get started</button>
    <button id="dead" class="btn">Learn more</button>
    <div class="icons"><a href="/about.html" class="tiny">i</a><a href="/contact.html" class="tiny">?</a></div>
  </main>
  <script>
    document.getElementById('price').textContent = (Number('abc') * 12).toString();
    document.getElementById('buy').addEventListener('click', function () {
      var cart = undefined;
      cart.items.push('widget');
    });
  </script>
</body>
</html>
